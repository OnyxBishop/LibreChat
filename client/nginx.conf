server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name patriciaa.ru www.patriciaa.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl; 
    http2 on;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;

    client_max_body_size 512M;

    server_name patriciaa.ru www.patriciaa.ru;

    # Встроенный DNS Docker — резолвим api на каждый запрос, чтобы после
    # пересоздания контейнера api (новый IP) nginx не залипал на старом
    # адресе (это и давало 502 до ручного перезапуска nginx).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # proxy_pass через переменную заставляет nginx резолвить api во время
        # запроса (через resolver выше), а не кэшировать IP при старте воркера.
        set $upstream_api http://api:3080;
        proxy_pass $upstream_api;
        proxy_buffering off;
        
        # Критически важно для работы WebSocket и стриминга
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Стандартные заголовки проксирования
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
